[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scpreflight"
dynamic = ["version"]
description = "Find out what is really inside a single-cell dataset (raw counts or normalized, log base, scaled, gene ID problems) before you analyze it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Yash Bhida" }]
keywords = ["single-cell", "scRNA-seq", "anndata", "scanpy", "quality control", "bioinformatics", "normalization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Environment :: Console",
]
dependencies = ["numpy>=1.21", "scipy>=1.8", "pandas>=1.3", "h5py>=3.0"]

[project.optional-dependencies]
anndata = ["anndata>=0.8"]
test = ["pytest>=7", "anndata>=0.8"]

[project.scripts]
scpreflight = "scpreflight.cli:main"

[project.urls]
Homepage = "https://github.com/bhodayasa/scpreflight"
Issues = "https://github.com/bhodayasa/scpreflight/issues"

[tool.setuptools.dynamic]
version = { attr = "scpreflight.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
