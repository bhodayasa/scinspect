name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Show versions
        run: python -c "import sys, numpy, scipy, pandas, h5py, anndata; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'pandas', pandas.__version__, 'h5py', h5py.__version__, 'anndata', anndata.__version__)"
      - name: Diagnose h5ad
        if: matrix.python-version == '3.13'
        continue-on-error: true
        run: python ci/diag.py
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          status=0
          python -m pytest -v -rfE --tb=line 2>&1 | tee pytest.log || status=$?
          if [ "$status" != "0" ]; then
            # Surface failures as annotations so they are visible without opening the log
            grep -E "^(FAILED|ERROR) |^[^ ].*:[0-9]+: |Error|passed|failed" pytest.log | tail -40 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
          fi
          exit $status
