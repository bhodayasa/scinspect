name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Show versions
        run: python -c "import sys, numpy, scipy, pandas, h5py, anndata; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'pandas', pandas.__version__, 'h5py', h5py.__version__, 'anndata', anndata.__version__)"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          status=0
          python -m pytest -v -rfE --tb=line 2>&1 | tee pytest.log || status=$?
          if [ "$status" != "0" ]; then
            grep -E "^(FAILED|ERROR) |^[^ ].*:[0-9]+: |Error|passed|failed" pytest.log | tail -40 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
          fi
          exit $status

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check package
        shell: bash
        run: |
          python -m pip install build twine anndata
          python -m build
          python -m twine check --strict dist/*
      - name: Make sample files and fetch real test data
        shell: bash
        run: |
          python ci/make_samples.py samples
          mkdir real
          git clone -q --depth 1 https://github.com/scverse/scanpy real/scanpy
          git clone -q --depth 1 https://github.com/scverse/anndata real/anndata
      - name: Install wheel into a clean environment
        shell: bash
        run: |
          python -m venv clean
          if [ -f clean/Scripts/python.exe ]; then PY=clean/Scripts/python.exe; EXE=clean/Scripts/scinspect.exe; else PY=clean/bin/python; EXE=clean/bin/scinspect; fi
          $PY -m pip install -q dist/*.whl
          echo "EXE=$EXE" >> $GITHUB_ENV
      - name: Smoke test the installed command
        shell: bash
        run: python ci/smoke.py "$EXE" samples real
